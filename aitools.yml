version: '3.3'

services:
  mcp:
    ports: 
      - "127.0.0.1:9345:80"
    image: devprom/mcp-alm-app:latest
    restart: unless-stopped
    privileged: true
    environment:
      - MCP_DNS_REBINDING_PROTECTION=0
    
  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    env_file:
      - .env
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:${PORT_CHROMADB}:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma_data
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/chroma_data

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    env_file:
      - .env
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:${PORT_OLLAMA}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ollama_data:/root/.ollama

  ollama_models:
    image: alpine/curl
    depends_on:
      - ollama
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      curl http://127.0.0.1:11434/api/pull -d '{\"model\": \"nomic-embed-text-v2-moe\"}';
      exit 0;
      "

  hermes:
    image: devprom/hermes:latest
    restart: unless-stopped
    privileged: true
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      - API_SERVER_ENABLED=true
      - API_SERVER_PORT=8642
      - API_SERVER_KEY="${HERMES_API_SERVER_KEY}"
      - API_SERVER_HOST="0.0.0.0"
      - HERMES_DASHBOARD="true"
      - HERMES_UID="1000"
      - HERMES_GID="1000"
      - DEVPROM_AGENT_PLUGIN_KEY="${HERMES_PLUGIN_KEY}"
      - SANDBOX_IMAGE="devprom/hermes-sandbox:latest"
    volumes:
      - hermes_state:/opt/data
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"

volumes:
  chroma_data:
  ollama_data:
  hermes_state:
